name: Backend CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Lint, Type-check & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: lumabet
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lumabet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://lumabet:postgres@localhost:5432/lumabet_test
      LUMABET_COIN_FLIP_CONTRACT_ID: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD
      STELLAR_NETWORK: testnet
      JWT_SECRET: ci-test-jwt-secret-at-least-32-chars-long

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Run migrations
        run: |
          for f in src/db/migrations/*.sql; do psql "$DATABASE_URL" -f "$f"; done

      - name: Test with coverage
        run: pnpm test

      - name: Build
        run: pnpm build
